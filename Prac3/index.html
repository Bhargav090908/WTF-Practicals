<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Bank Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Secure Bank Ltd.</h1>
    <h2>JavaScript Banking Utilities</h2>
    <div class="container">

        <label>Customer Name</label>
        <input type="text" id="name">

        <label>Age</label>
        <input type="number" id="age">

        <label>Monthly Income</label>
        <input type="number" id="income">

        <label>Loan Amount</label>
        <input type="number" id="loan">

        <label>Interest Rate</label>
        <input type="number" id="rate">

        <label>Loan Duration</label>
        <input type="number" id="years">

        <button onclick = "checkEligibility()">Loan Eligibility</button>
        <button onclick = "calculateEMI()">Calculate EMI</button>
        <button onclick = "calculateInterest()">Simple Interest</button>
        <button onclick = "generateInterestTable()">Interest Table</button>
        <button onclick = "accountType()">Account Type</button>
        <button onclick = "showScope()">Variable Scope</button>
        <div id="output"></div>
        
        
    </div>
    <script src="script.js"></script>
</body>
</html>
